<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222426"><meta name="description" content="头号输家实体棋盘手机版，按原图路线掷骰前进，连接原版配套小游戏。"><title>头号输家 · 手机棋盘</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23adc6f4'/%3E%3Ctext x='16' y='25' text-anchor='middle' font-size='27' font-weight='bold'%3E%3F%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=2"></head>
<body><header><div><span class="eyebrow">HEAD NUMBER LOSER</span><h1>头号输家<span>手机棋盘</span></h1></div><button id="newGame" class="subtle">玩家设置</button></header>
<main><section class="table"><div class="board-tools"><span>原版路线 · 点击格子看规则</span><div><button id="zoomOut" aria-label="缩小棋盘">−</button><button id="zoomIn" aria-label="放大棋盘">＋</button><button id="fit">全图</button></div></div><div id="viewport"><div id="board"><img src="board-v2.jpg" alt="头号输家原版实体棋盘，从左下 START 沿弯曲路线走向中央终点" draggable="false"><div id="spaces"></div><div id="pieces"></div></div></div></section>
<aside><section class="turn-card"><div class="turn-label">轮到你了 <span id="round">第 1 轮</span></div><h2 id="currentName">先添加玩家</h2><p id="position">同一部手机，轮流掷骰</p><div id="dice" aria-label="骰子" aria-live="polite">⚄</div><button class="primary" id="roll">开始游戏</button><p id="notice" role="status">沿原棋盘前进，停在哪格就执行哪格。</p></section><section class="players-card"><h3>在场玩家</h3><div id="players"><p class="muted">设置名字后即可开局。</p></div></section><nav class="companion"><h3>原版配套小程序</h3><a href="https://unitp.cc/#home" target="_blank" rel="noopener">打开配套小程序 <span>↗</span></a><p>完成配套游戏后，返回这里继续。</p></nav><button id="undo" class="subtle" hidden>撤销上次掷骰</button></aside></main>
<dialog id="setup"><form id="setupForm"><div class="modal-top"><span class="eyebrow">准备开局</span><button type="button" class="close" id="closeSetup" aria-label="关闭">×</button></div><h2>今晚都有谁？</h2><p class="muted">按座位顺序添加玩家。</p><div id="nameInputs"></div><button type="button" class="add" id="addPlayer">＋ 添加玩家</button><p id="setupError" role="alert"></p><button class="primary" type="submit">开始掷骰</button><p class="fine">进度保存在本机浏览器。</p></form></dialog>
<dialog id="event"><div class="modal-top"><span class="eyebrow" id="eventNumber"></span><button class="close" id="closeEvent" aria-label="关闭规则">×</button></div><div id="eventSymbol"></div><h2 id="eventTitle"></h2><p id="eventText"></p><div id="eventOptions"></div><div id="eventActions"></div></dialog>
<script src="board-data.js?v=2"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
